<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f5f2" />
    <title>OpenCode Project Manager</title>
  </head>
  <body>
    <main class="shell">
      <div class="workspace-layout">
        <aside class="navigation" aria-label="Workspace navigation">
          <div id="show-directories-root"></div>
          <section class="quick-section">
            <div class="quick-section-heading">
              <h3>Quick Requests</h3>
              <div id="show-history-root"></div>
            </div>
             <ul id="quick-request-list"><li>None yet</li></ul>
          </section>
          <div class="navigation-heading"><h2>Workspaces</h2></div>
           <div id="workspace-navigation-root"></div>
          <div id="new-work-menu-root"></div>
        </aside>
          <section class="quick-view" aria-label="Selected work">
            <div id="workbench-root"></div>
              <div id="right-content-root"></div>
        </section>
      </div>

      <section class="visually-hidden" aria-labelledby="connection-title">
        <div id="application-status-root"></div>
      </section>

      <div id="app-notice-root"></div>
    </main>

    <div id="new-work-dialog-root"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
