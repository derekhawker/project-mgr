[package]
name = "opencode-project-manager"
version = "0.1.0"
description = "OpenCode Project Manager desktop application"
authors = ["OpenCode project-mgr"]
edition = "2021"
default-run = "opencode-project-manager"

[features]
integration-test-harnesses = []
terminal-perf-harness = []

[[bin]]
name = "opencode-project-manager"
path = "src/main.rs"

[[bin]]
name = "model-loader-harness"
path = "src/bin/model-loader-harness.rs"
required-features = ["integration-test-harnesses"]

[[bin]]
name = "wire-contract-harness"
path = "src/bin/wire-contract-harness.rs"
required-features = ["integration-test-harnesses"]

[[bin]]
name = "terminal-perf-harness"
path = "src/bin/terminal-perf-harness.rs"
required-features = ["terminal-perf-harness"]

[lib]
name = "opencode_project_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
png = "0.18"
tauri-build = { version = "2", features = [] }

[dependencies]
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["sync"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
base64 = "0.22"
portable-pty = "0.9"
notify = "8"
ignore = "0.4"
libc = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
tempfile = "3"
