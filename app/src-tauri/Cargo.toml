[package]
name = "opencode-project-manager"
version = "0.1.0"
description = "OpenCode Project Manager desktop application"
authors = ["OpenCode project-mgr"]
edition = "2021"

[lib]
name = "opencode_project_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
png = "0.18"
tauri-build = { version = "2", features = [] }

[dependencies]
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"

[dev-dependencies]
serde_json = "1"
tempfile = "3"
