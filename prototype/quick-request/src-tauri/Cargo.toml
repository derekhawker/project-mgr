[package]
name = "quick-request-prototype"
version = "0.1.0"
description = "Throwaway OpenCode Quick Request integration prototype"
authors = ["OpenCode project-mgr"]
edition = "2021"

[lib]
name = "quick_request_prototype_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
png = "0.18"
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
portable-pty = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
