<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title description">
  <title id="title">OpenCode Project Manager — exploratory workspace detail sketch</title>
  <desc id="description">Grayscale exploratory desktop sketch. Persistent left navigation emphasizes regular workspaces and their directly nested tasks, with Quick Requests from the last 24 hours below. The main pane keeps workspace and task controls compact so the selected task's interactive OpenCode terminal dominates the view; New task opens a compact composer overlay.</desc>
  <style>
    text { font-family: system-ui, sans-serif; fill: #242424; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .muted { fill: #696969; }
    .light { fill: #f2f2f0; }
    .tiny { font-size: 11px; letter-spacing: .06em; }
    .small { font-size: 12px; }
    .body { font-size: 14px; }
    .label { font-size: 13px; font-weight: 650; }
    .heading { font-size: 23px; font-weight: 650; }
    .panel { fill: #fafaf9; stroke: #c9c9c6; stroke-width: 1; }
    .line { stroke: #d4d4d1; stroke-width: 1; }
    .soft { fill: #efefed; }
    .dark { fill: #333; }
    .terminal-text { fill: #f2f2f0; }
  </style>

  <!-- Window and persistent workspace navigation -->
  <rect width="1440" height="960" fill="#f4f4f2"/>
  <rect width="300" height="960" fill="#e9e9e7"/>
  <line x1="300" y1="0" x2="300" y2="960" stroke="#c9c9c6"/>
  <rect x="20" y="20" width="30" height="30" rx="5" fill="#333"/>
  <text x="35" y="41" text-anchor="middle" font-size="17" font-weight="700" class="light">O</text>
  <text x="60" y="34" font-size="13" font-weight="650">OpenCode</text>
  <text x="60" y="49" font-size="12" class="muted">Project Manager</text>
  <rect x="1150" y="17" width="258" height="32" rx="4" fill="#ececea" stroke="#a9a9a6"/>
  <text x="1279" y="37" text-anchor="middle" class="tiny" font-weight="700">EXPLORATORY · NOT FINAL</text>

  <text x="20" y="83" class="tiny muted" font-weight="700">WORKSPACES</text>
  <rect x="16" y="96" width="268" height="38" rx="5" fill="#373737"/>
  <text x="32" y="120" font-size="19" class="light" font-weight="400">+</text>
  <text x="55" y="120" class="label light">New workspace</text>

  <!-- Workspace → Task tree. Idle workspace remains visible. -->
  <rect x="12" y="147" width="276" height="34" rx="4" fill="#d8d8d5"/>
  <path d="M25 159 l5 -5 l5 5 M30 154 v13" fill="none" stroke="#555" stroke-width="1.4"/>
  <rect x="43" y="157" width="12" height="12" rx="2" fill="#777"/>
  <text x="64" y="169" class="label">Project Manager</text>
  <text x="272" y="168" text-anchor="end" class="tiny muted">2</text>
  <line x1="51" y1="187" x2="51" y2="239" stroke="#aaa" stroke-width="1.5"/>
  <line x1="51" y1="201" x2="66" y2="201" stroke="#aaa" stroke-width="1.5"/>
  <line x1="51" y1="231" x2="66" y2="231" stroke="#aaa" stroke-width="1.5"/>
  <rect x="65" y="187" width="215" height="28" rx="4" fill="#f6f6f4" stroke="#a9a9a6"/>
  <circle cx="79" cy="201" r="4" fill="#666"/>
  <text x="91" y="205" class="small" font-weight="650">Repository setup flow</text>
  <text x="91" y="235" class="small">Document project decisions</text>

  <path d="M25 267 l5 -5 l5 5 M30 262 v13" fill="none" stroke="#777" stroke-width="1.4"/>
  <rect x="43" y="265" width="12" height="12" rx="2" fill="#999"/>
  <text x="64" y="277" class="body">Todo app</text>
  <line x1="51" y1="284" x2="51" y2="316" stroke="#aaa" stroke-width="1.5"/>
  <line x1="51" y1="300" x2="66" y2="300" stroke="#aaa" stroke-width="1.5"/>
  <text x="75" y="304" class="small">Account sync</text>

  <path d="M25 339 l5 -5 l5 5 M30 334 v13" fill="none" stroke="#777" stroke-width="1.4"/>
  <rect x="43" y="337" width="12" height="12" rx="2" fill="#999"/>
  <text x="64" y="349" class="body">Film tracker</text>
  <rect x="218" y="334" width="57" height="20" rx="10" fill="#eeeeec" stroke="#c9c9c6"/>
  <text x="246" y="348" text-anchor="middle" class="tiny" font-weight="700">IDLE</text>
  <text x="64" y="369" class="small muted">No active tasks or sessions</text>

  <line x1="20" y1="398" x2="280" y2="398" class="line"/>
  <!-- Quick Requests are secondary navigation, shown below regular workspaces. -->
  <text x="20" y="426" class="label">Quick Requests</text>
  <rect x="132" y="410" width="108" height="24" rx="4" fill="#eeeeec" stroke="#d4d4d1"/>
  <text x="186" y="426" text-anchor="middle" class="tiny muted">+ Quick Request</text>
  <text x="280" y="426" text-anchor="end" class="tiny muted">LAST 24H</text>

  <rect x="16" y="440" width="268" height="66" rx="5" fill="#e2e2df" stroke="#b5b5b1"/>
  <circle cx="31" cy="459" r="4" fill="#555"/>
  <text x="43" y="463" class="small" font-weight="650">Compare API approaches</text>
  <text x="29" y="481" class="tiny muted">32 min ago</text>
  <rect x="190" y="470" width="80" height="20" rx="10" fill="#d1d1ce"/>
  <text x="230" y="484" text-anchor="middle" class="tiny" font-weight="700">RUNNING</text>

  <rect x="16" y="513" width="268" height="66" rx="5" class="panel"/>
  <circle cx="31" cy="532" r="4" fill="#888"/>
  <text x="43" y="536" class="small" font-weight="650">Review dependency update</text>
  <text x="29" y="554" class="tiny muted">3 hr ago</text>
  <rect x="151" y="543" width="119" height="20" rx="10" fill="#e5e5e2" stroke="#c5c5c1"/>
  <text x="210" y="557" text-anchor="middle" font-size="9" font-weight="700">WAITING FOR INPUT</text>

  <rect x="16" y="586" width="268" height="66" rx="5" class="panel"/>
  <circle cx="31" cy="605" r="4" fill="#aaa"/>
  <text x="43" y="609" class="small" font-weight="650">Summarize test results</text>
  <text x="29" y="627" class="tiny muted">18 hr ago</text>
  <rect x="155" y="616" width="115" height="20" rx="10" fill="#f0f0ee" stroke="#c5c5c1"/>
  <text x="212" y="630" text-anchor="middle" font-size="9" font-weight="700">READY FOR REVIEW</text>
  <text x="20" y="677" class="small muted">Quick Requests · shared request area</text>

  <rect x="16" y="909" width="268" height="34" rx="5" fill="#e1e1de" stroke="#c9c9c6"/>
  <circle cx="32" cy="926" r="5" fill="#777"/>
  <text x="45" y="930" class="small">Local application</text>

  <!-- Main pane: one selected workspace, not a workspace directory screen. -->
  <rect x="300" y="0" width="1140" height="66" fill="#fafaf9"/>
  <line x1="300" y1="66" x2="1440" y2="66" class="line"/>
  <text x="330" y="40" class="small muted">Workspaces</text>
  <text x="402" y="40" class="small muted">/</text>
  <text x="418" y="40" class="small" font-weight="650">Project Manager</text>

  <!-- Compact workspace header and task selector leave the main area to the session. -->
  <text x="330" y="111" class="heading">Project Manager</text>
  <text x="330" y="133" class="small muted">Active workspace</text>
  <rect x="1270" y="86" width="138" height="40" rx="5" fill="#373737"/>
  <text x="1287" y="112" font-size="19" class="light">+</text>
  <text x="1310" y="111" class="label light">New task</text>

  <!-- Tasks belong directly to this workspace; select one to show its session. -->
  <rect x="330" y="148" width="450" height="38" rx="5" fill="#dededb" stroke="#888" stroke-width="1.2"/>
  <circle cx="348" cy="167" r="4" fill="#555"/>
  <text x="362" y="172" class="small" font-weight="650">Repository setup flow</text>
  <text x="757" y="172" text-anchor="end" class="tiny muted" font-weight="700">RUNNING</text>
  <rect x="788" y="148" width="376" height="38" rx="5" class="panel"/>
  <circle cx="806" cy="167" r="4" fill="#aaa"/>
  <text x="820" y="172" class="small">Document project decisions</text>
  <text x="1408" y="172" text-anchor="end" class="tiny muted">2 TASKS</text>

  <!-- Terminal takes about 85% of the usable main-pane width and most of its height. -->
  <rect x="330" y="201" width="915" height="701" rx="6" class="panel"/>
  <rect x="330" y="201" width="915" height="48" rx="6" fill="#e8e8e5"/>
  <text x="350" y="231" class="label">Interactive OpenCode terminal</text>
  <text x="1225" y="231" text-anchor="end" class="tiny muted">TASK SESSION · REPOSITORY SETUP FLOW</text>
  <rect x="346" y="265" width="883" height="621" rx="4" class="dark"/>
  <text x="370" y="298" class="tiny terminal-text" font-weight="700">OPENCODE · TASK SESSION</text>
  <text x="370" y="335" class="small mono terminal-text">Checking the selected repository context…</text>
  <text x="370" y="361" class="small mono terminal-text">Preparing the task setup plan.</text>
  <text x="370" y="401" class="small mono terminal-text">› Working…</text>
  <line x1="370" y1="829" x2="1205" y2="829" stroke="#777"/>
  <text x="370" y="858" class="small mono terminal-text">Type in this terminal to follow up</text>

  <!-- New task is visible above; its compact composer overlays this view on demand. -->
  <rect x="1262" y="201" width="146" height="190" rx="6" class="panel"/>
  <text x="1278" y="229" class="tiny muted" font-weight="700">NEW TASK</text>
  <line x1="1278" y1="242" x2="1392" y2="242" class="line"/>
  <text x="1278" y="268" class="small" font-weight="650">Workspace-scoped</text>
  <text x="1278" y="289" class="small">composer opens</text>
  <text x="1278" y="310" class="small">as a compact</text>
  <text x="1278" y="331" class="small">overlay; the</text>
  <text x="1278" y="352" class="small">terminal stays</text>
  <text x="1278" y="373" class="small">in place.</text>

  <!-- Exploratory annotation, not a promise about final layout. -->
  <text x="330" y="930" class="tiny muted" font-weight="700">EXPLORATORY · NOT FINAL</text>
  <text x="520" y="930" class="small muted">Workspace → Task only. Terminal size and composer interaction are exploratory.</text>
  <text x="1408" y="930" text-anchor="end" class="tiny muted">1440 × 960</text>
</svg>
